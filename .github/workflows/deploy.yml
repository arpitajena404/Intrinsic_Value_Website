name: Build and Deploy Site to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'homepage_config.json'
      - 'pricing.json'
      - 'blogs.json'
      - 'live_config.js'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Recompile Static Pages
        run: |
          node scripts/update_homepage.js
          node scripts/update_pricing.js

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            server.py
            README.md
            __pycache__/**
